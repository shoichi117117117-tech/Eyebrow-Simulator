<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eyebrow Simulator</title>
  
  <!-- External CSS -->
  <link rel="stylesheet" href="css/style.css">

  <!-- MediaPipe FaceMesh CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh/face_mesh.js" crossorigin="anonymous"></script>
</head>
<body>

  <!-- Main Canvas Preview Area -->
  <div class="canvas-container">
    <canvas id="stage"></canvas>
  </div>

  <!-- Sidebar Control Panel -->
  <div class="controls">
    <h3>Eyebrow Simulator</h3>
    <input type="file" id="upload" accept="image/*" class="file-input">

    <div class="control-group">
      <label>Height (Y-Offset) <span id="val-offsetY">0</span></label>
      <input type="range" id="offsetY" min="-30" max="30" value="0">
    </div>

    <div class="control-group">
      <label for="sharpness">Eyebrow Distance (X-Offset)</label>
      <input type="range" id="sharpness" min="-2" max="2" step="0.1" value="0">
    </div>
    
    <div class="control-group">
      <label>Angle (Rotation) <span id="val-angle">0</span>°</label>
      <input type="range" id="angle" min="-15" max="15" value="0">
    </div>

    <div class="control-group">
      <label>Length <span id="val-length">1.0</span>x</label>
      <input type="range" id="length" min="0.7" max="1.4" step="0.05" value="1.0">
    </div>

    <div class="control-group">
      <label>Thickness <span id="val-thickness">1.0</span>x</label>
      <input type="range" id="thickness" min="0.5" max="1.8" step="0.05" value="1.0">
    </div>

    <div class="control-group">
      <label>Opacity <span id="val-opacity">0.5</span></label>
      <input type="range" id="opacity" min="0.1" max="0.9" step="0.05" value="0.5">
    </div>

    <div class="template-selector">
      <h3>Select eyebrow template</h3>
      <div id="template-buttons-container" class="template-grid"></div>
    </div>

    <div class="control-group">
      <label>Eyebrow Color</label>
      <div class="color-presets">
        <button type="button" class="color-btn color-dark-brown" data-color="#281e14" title="Dark Brown"></button>
        <button type="button" class="color-btn color-natural-brown" data-color="#4a3525" title="Natural Brown"></button>
        <button type="button" class="color-btn color-light-brown" data-color="#7a5230" title="Light Brown"></button>
        <button type="button" class="color-btn color-ash-black" data-color="#2c2c2c" title="Ash Black"></button>
        <input type="color" id="colorPicker" value="#281e14">
      </div>
    </div>
  </div>

  <!-- Application Logic -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
